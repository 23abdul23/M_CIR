services:
  frontend:
    build:
      context: ./warrior-support-system
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
      - python-backend
    ports:
      - "8080:80"
    restart: unless-stopped

  backend:
    build:
      context: ./warrior-support-system/backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-warrior-support-system}
      JWT_SECRET: ${JWT_SECRET:-change-me}
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    restart: unless-stopped

  python-backend:
    build:
      context: ./warrior-support-system/python-backend
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      MODELS_DIR: /app/data/models
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      TORCH_HOME: /app/.cache/torch
      XDG_CACHE_HOME: /app/.cache
    ports:
      - "8000:8000"
    volumes:
      - python_model_data:/app/data/models
      - python_cache:/app/.cache
      - python_sessions:/app/sessions
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  python_model_data:
  python_cache:
  python_sessions:
